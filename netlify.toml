[build]
  command = "node build.mjs"
  publish = "public-build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"

# A single gallery visit can request dozens of photos, fonts and video ranges.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  [redirects.rate_limit]
    window_limit = 600
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  [redirects.rate_limit]
    window_limit = 120
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[headers]]
  for = "/assets/v/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
